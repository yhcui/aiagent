<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手语数字人播放器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    padding: 14px 20px;
    background: rgba(30, 41, 59, 0.8);
    border-bottom: 1px solid rgba(148, 163, 184, 0.2);
    display: flex;
    align-items: center; gap: 12px;
  }
  header h1 { font-size: 16px; font-weight: 600; }
  header .badge {
    font-size: 12px; padding: 2px 8px; border-radius: 999px;
    background: rgba(56, 189, 248, 0.15); color: #7dd3fc;
  }
  #canvas-wrap { flex: 1; position: relative; background: radial-gradient(ellipse at center, rgba(56,189,248,0.06), transparent 60%), linear-gradient(180deg, #0f172a, #1e293b); }
  #player { width: 100%; height: 100%; display: block; }
  #status {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    font-size: 13px; padding: 6px 14px; border-radius: 999px;
    background: rgba(15,23,42,0.75); color: #94a3b8;
    backdrop-filter: blur(6px); border: 1px solid rgba(148,163,184,0.15);
    transition: all 0.3s; white-space: nowrap; max-width: 90%; overflow: hidden; text-overflow: ellipsis;
  }
  #status.loading { color: #fbbf24; }
  #status.error { color: #f87171; }
  footer {
    padding: 12px 20px 16px;
    background: rgba(30, 41, 59, 0.9);
    border-top: 1px solid rgba(148, 163, 184, 0.2);
    display: flex; align-items: center; gap: 10px;
  }
  footer input {
    flex: 1; padding: 10px 14px; border-radius: 10px;
    border: 1px solid rgba(148,163,184,0.25); outline: none;
    background: rgba(15,23,42,0.6); color: #e2e8f0; font-size: 15px;
  }
  footer input:focus { border-color: #38bdf8; }
  footer button {
    padding: 10px 22px; border: none; border-radius: 10px;
    background: linear-gradient(135deg, #38bdf8, #6366f1);
    color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
  }
  footer button:hover { opacity: 0.9; }
  footer button:active { transform: scale(0.97); }
  footer button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<header>
  <h1>手语数字人播放器</h1>
  <span class="badge" id="mode-badge">初始化</span>
</header>
<div id="canvas-wrap">
  <canvas id="player"></canvas>
  <div id="status">初始化中…</div>
</div>
<footer>
  <input id="text-input" placeholder="输入要翻译成手语的话（如：你好世界）" value="深度融合">
  <button id="play-btn">播放</button>
</footer>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
/**
 * ============================================
 * Three.js 导入（使用 ES Module 方式）
 * ============================================
 */
// 从 three 库导入所有导出内容，并重命名为 THREE 命名空间
// THREE 对象包含了 Three.js 的所有核心类：Scene, Camera, Mesh, Vector3 等
import * as THREE from 'three';

// GLTFLoader: 用于加载 .gltf / .glb 格式的 3D 模型文件
// 这是 Three.js 官方推荐的模型格式，支持骨骼动画、材质、纹理等
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// MeshoptDecoder: 用于解码 Meshopt 压缩格式的模型数据
// 可以大幅减小 GLTF 模型的文件体积，加快加载速度
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

// 将 THREE 和 renderer 暴露到全局 window 对象，方便浏览器控制台调试
window.THREE = THREE; // 调试钩子：在控制台可直接访问 THREE.xxx
window.__renderer = null; // 调试钩子：保存渲染器引用

// ============ UI 元素获取 ============
// getElementById: DOM API，获取页面上指定 id 的 HTML 元素
const statusEl = document.getElementById('status');      // 状态提示文字
const modeBadge = document.getElementById('mode-badge'); // 右上角模式徽章
const canvas = document.getElementById('player');        // Three.js 渲染画布
const input = document.getElementById('text-input');    // 文本输入框
const playBtn = document.getElementById('play-btn');    // 播放按钮

/**
 * 更新状态显示
 * @param {string} text - 显示的文字
 * @param {string} cls - CSS 类名（loading/error 等）
 */
function setStatus(text, cls) { statusEl.textContent = text; statusEl.className = cls || ''; }

/**
 * ============================================
 * Three.js 渲染器设置
 * ============================================
 */
// WebGLRenderer: Three.js 的 WebGL 渲染器，负责将 3D 场景绘制到 Canvas
// 选项说明：
//   - canvas: 指定绑定的 Canvas 元素
//   - antialias: 启用抗锯齿，让模型边缘更平滑
//   - alpha: 允许透明背景
//   - preserveDrawingBuffer: 保持绘制缓冲区，用于截图等操作
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });

// setSize: 设置渲染分辨率（像素尺寸）
// 这里使用 CSS 渲染尺寸（clientWidth/clientHeight），不是屏幕物理像素
renderer.setSize(canvas.clientWidth, canvas.clientHeight);

// setPixelRatio: 设置像素比，限制最高为 2
// devicePixelRatio 是屏幕物理像素与 CSS 像素的比值（Retina 屏通常为 2）
// 设为 min(2, ratio) 可以避免在极高 DPI 屏幕上过度消耗性能
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

// outputColorSpace: 设置输出色彩空间
// THREE.SRGBColorSpace 确保颜色显示正确，与标准显示器色彩空间一致
renderer.outputColorSpace = THREE.SRGBColorSpace;

/**
 * ============================================
 * Three.js 场景（Scene）和相机（Camera）设置
 * ============================================
 */
// Scene: 3D 场景容器，用于存放所有 3D 对象（模型、灯光、相机等）
const scene = new THREE.Scene();

/**
 * PerspectiveCamera: 透视相机，模拟人眼视觉效果
 * 参数说明：
 *   - 第一个参数(45): 垂直视野角度（FOV），单位度，越大视角越宽
 *   - 第二个参数: 宽高比（aspect），必须与渲染区域一致
 *   - 第三个参数(0.1): 近裁切面距离，比这近的物体不渲染
 *   - 第四个参数(100): 远裁切面距离，比这远的物体不渲染
 */
const camera = new THREE.PerspectiveCamera(45, canvas.clientWidth / canvas.clientHeight, 0.1, 100);

// position: 相机在 3D 空间中的位置 (x, y, z)
// x=0: 水平居中; y=1.6: 高度约1.6米（正常人眼高度）; z=3.2: 距模型约3.2米
camera.position.set(0, 1.6, 3.2);

// lookAt: 设置相机朝向的目标点
// 参数是 Vector3 格式：x=0（居中）, y=1.1（看向身体中部）, z=0
camera.lookAt(0, 1.1, 0);

/**
 * ============================================
 * Three.js 灯光设置
 * ============================================
 */
// AmbientLight: 环境光，光线均匀照射到所有物体，没有方向
// 第一个参数: 颜色（十六进制），0xffffff 表示白色
// 第二个参数: 强度，0.9 表示 90% 亮度
scene.add(new THREE.AmbientLight(0xffffff, 0.9));

/**
 * DirectionalLight: 方向光/平行光
 * 模拟太阳光，光线从同一方向照射到所有物体
 * 参数：颜色, 强度
 */
const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
// position: 灯光位置 (1.5, 2.5, 2)
// 表示光从右上方偏前（演员右肩方向）照射过来
dirLight.position.set(1.5, 2.5, 2);
scene.add(dirLight);

// 添加第二盏方向光，蓝色调(0x88ccff)，强度0.5，位置偏左(-2)
// 作用：补充左侧阴影细节，增加立体感
scene.add(new THREE.DirectionalLight(0x88ccff, 0.5).translateX(-2));

/**
 * GridHelper: 地面网格辅助线
 * 参数：gridSize(4) 网格总尺寸, divisions(20) 网格分割数,
 *       colorCenterLine(0x38bdf8) 中心线颜色, colorGrid(0x334155) 普通网格颜色
 * 用途：帮助判断模型位置和比例
 */
const grid = new THREE.GridHelper(4, 20, 0x38bdf8, 0x334155);
scene.add(grid);

/**
 * ============================================
 * Three.js 3D 模型加载
 * ============================================
 */
// GLTFLoader: GLTF/GLB 格式的加载器
const loader = new GLTFLoader();
// setMeshoptDecoder: 注册 Meshopt 压缩格式的解码器
// 这样加载器就能自动识别并解码 .glb 文件中的 meshopt 压缩数据
loader.setMeshoptDecoder(MeshoptDecoder);

// 变量声明
let model,        // 加载的 3D 模型对象
    mixer,        // AnimationMixer 用于播放骨骼动画
    morphNodeName = 'Head'; // 变形目标（口型）的网格节点名称

/**
 * 加载 3D 模型（.gltf 文件）
 * 异步函数，使用 await 等待加载完成
 */
async function loadModel() {
  setStatus('加载模型…', 'loading');
  
  // loadAsync: GLTFLoader 的异步加载方法，返回包含场景数据的 gltf 对象
  // gltf.scene 是模型根节点（Group 类型）
  const gltf = await loader.loadAsync('1014_01.gltf');
  model = gltf.scene;
  
  // 暴露到全局供调试用
  window.__model = model;
  
  // traverse: 遍历场景树的所有子节点，对每个节点执行回调
  // isMesh: 判断对象是否为 Mesh 类型（包含几何体和材质）
  // morphTargetInfluences: 变形目标的影响权重数组（口型动画用）
  const morph = [];
  model.traverse(o => { if (o.isMesh && o.morphTargetInfluences) morph.push(o); });
  
  // 取第一个有变形目标的网格名称作为 morphNodeName
  if (morph.length && morph[0].name) morphNodeName = morph[0].name;
  
  // 将模型添加到场景中（这样才能被渲染）
  scene.add(model);
  
  /**
   * AnimationMixer: 动画混合器
   * 是 Three.js 专门用于管理骨骼动画的核心类
   * 参数：要播放动画的模型对象
   */
  mixer = new THREE.AnimationMixer(model);
  console.log('模型就绪, morph 网格:', morph.length, '名称:', morphNodeName);
}

/**
 * ============================================
 * Three.js 动画工具函数
 * ============================================
 */
/**
 * 重新映射动画轨道（Tracks）到模型
 * 由于模型结构原因，原始动画中的骨骼名称可能与实际模型不匹配
 * @param {AnimationClip} clip - 原始动画片段
 * @param {Object3D} root - 模型根节点
 * @returns {AnimationClip} - 重新映射后的动画片段
 */
function remapClipToModel(clip, root) {
  const tracks = [];
  // clip.tracks: 动画轨道数组，每个轨道描述一个属性的动画变化
  for (const t of clip.tracks) {
    // 轨道名称格式通常是 "BoneName.property"，用 lastIndexOf('.') 提取骨骼名
    const dot = t.name.lastIndexOf('.');
    const nodeName = t.name.slice(0, dot);
    // getObjectByName: 在模型中查找指定名称的子节点
    // 如果模型中不存在该骨骼，则跳过这个轨道
    if (!root.getObjectByName(nodeName)) continue;
    tracks.push(t.clone()); // 克隆轨道（避免修改原始数据）
  }
  // 创建新的动画片段
  return new THREE.AnimationClip(clip.name, clip.duration, tracks);
}

// 口型变形目标索引映射表（不同字母对应不同的 morphTarget）
// 例如 'A' 对应 morphTargetInfluences[7]
const MORPH_INDEX = { 'A': 7, 'B': 14, 'E': 8, 'F': 13, 'I': 9, 'L': 12, 'O': 10, 'T': 15, 'U': 11 };

/**
 * 构建口型表情动画片段（使用 morphTargetInfluences）
 * morphTarget（变形目标）是一种不依赖骨骼的口型动画技术
 * @param {Object} curves - 口型数据 { 'A': { times: [...], values: [...] }, ... }
 * @param {string} meshName - 网格名称（用于生成轨道名）
 * @returns {AnimationClip|null}
 */
function buildMorphClip(curves, meshName) {
  const tracks = [];
  let dur = 0; // 总时长
  
  // 遍历每种口型（字母）
  for (const [name, { times, values }] of Object.entries(curves)) {
    const idx = MORPH_INDEX[name]; // 查表获取对应的 morphTarget 索引
    if (idx === undefined) continue; // 跳过未知口型
    
    /**
     * NumberKeyframeTrack: 数值关键帧轨道
     * 参数1: 属性路径，格式 "MeshName.morphTargetInfluences[index]"
     *        morphTargetInfluences 是数组，存储每个变形目标的权重(0-1)
     * 参数2: 时间点数组 [0, 0.1, 0.2, ...]，单位秒
     * 参数3: 对应时间的数值数组 [0, 50, 80, ...]
     *        这里 values.map(v => v / 100) 将 0-100 转为 0-1 范围
     */
    tracks.push(new THREE.NumberKeyframeTrack(
      `${meshName}.morphTargetInfluences[${idx}]`, 
      times, 
      new Float32Array(values.map(v => v / 100))
    ));
    dur = Math.max(dur, times[times.length - 1]); // 取最大时间作为总时长
  }
  
  if (!tracks.length) return null; // 没有有效轨道返回 null
  
  /**
   * AnimationClip: 动画片段
   * 参数：名称（用随机字符串区分）, 持续时间（秒）, 轨道数组
   */
  return new THREE.AnimationClip('expr_' + Math.random().toString(36).slice(2, 7), dur, tracks);
}

/**
 * ============================================
 * 资源缓存与异步加载
 * ============================================
 */
// Map: JavaScript 内置的键值对数据结构，用于缓存已加载的资源
// 避免重复加载相同资源，提升性能
const gltfCache = new Map();   // 动作动画缓存
const animCache = new Map();   // 口型表情缓存

/**
 * 加载动作动画 GLTF（带缓存）
 * @param {string} id - 动作资源 ID
 * @returns {AnimationClip} 重新映射后的动画片段
 */
async function loadMotionGltf(id) {
  // 命中缓存直接返回
  if (gltfCache.has(id)) return gltfCache.get(id);
  
  setStatus(`下载动作 ${id}…`, 'loading');
  
  // fetch: 发送 HTTP 请求获取 GLTF 数据（以文本形式返回）
  const response = await fetch(`/api/gltf/${id}`);
  const gltfText = await response.text();
  
  // parseAsync: 异步解析 GLTF 文本为场景数据对象
  const gltf = await loader.parseAsync(gltfText, '');
  
  // 从 gltf.animations 数组取出第一个动画片段，重新映射到当前模型
  const clip = remapClipToModel(gltf.animations[0], model);
  
  // 存入缓存
  gltfCache.set(id, clip);
  return clip;
}

/**
 * 加载口型表情数据（带缓存）
 * @param {string} name - 口型名称（如 "ShenDu"）
 * @returns {AnimationClip|null} 构建的动画片段
 */
async function loadExpression(name) {
  // 命中缓存直接返回
  if (animCache.has(name)) return animCache.get(name);
  
  setStatus(`下载口型 ${name}…`, 'loading');
  
  // 从后端 API 获取口型数据（JSON 格式）
  // 返回格式示例: { curves: { 'A': { times: [0, 1], values: [0, 100] } } }
  const data = await (await fetch(`/api/anim/${name}`)).json();
  
  // 根据口型数据构建动画片段
  const clip = buildMorphClip(data.curves, morphNodeName);
  
  // 存入缓存
  animCache.set(name, clip);
  return clip;
}

/**
 * ============================================
 * 播放调度核心逻辑
 * ============================================
 */
// 播放状态标志
let playing = false,   // 当前是否正在播放
    stopFlag = false;  // 停止标志（用于中断播放）

/**
 * 构建播放列表（将文本转换为播放序列）
 * 实际上只是透传，真正翻译由后端处理
 * @param {string} text - 用户输入文本
 * @returns {string} - 原文本
 */
function buildPlaylist(text) {
  return text;
}

/**
 * 顺序播放一组动作+口型片段
 * @param {Array} words - 后端返回的播放数据
 *        格式: [{ motion: "00510 01220", expression: "Shen Du" }, ...]
 */
async function playSequence(words) {
  stopFlag = false; // 重置停止标志
  
  /**
   * 将嵌套结构展平为单独的动作片段
   * 例如: { motion: "A B", expression: "X Y Z" }
   * 展平为: [{ motion: A, expr: X }, { motion: B, expr: Y }, { expr: Z }]
   */
  const segments = [];
  for (const w of words) {
    const motions = (w.motion || '').trim().split(/\s+/).filter(Boolean);
    const exprs = (w.expression || '').trim().split(/\s+/).filter(Boolean);
    if (!motions.length) continue;
    
    // 为每个动作配对口型
    for (let i = 0; i < motions.length; i++) {
      segments.push({ motion: motions[i], expr: exprs[i] || null });
    }
    // 多余口型（exprs 多于 motions）作为纯口型段
    if (exprs.length > motions.length) {
      for (let i = motions.length; i < exprs.length; i++) {
        segments.push({ motion: null, expr: exprs[i] });
      }
    }
  }
  console.log('播放段:', segments);
  
  // 逐段播放
  for (let s = 0; s < segments.length; s++) {
    if (stopFlag) break; // 检查停止标志
    const seg = segments[s];
    try {
      if (seg.motion) {
        // 播放手势动作
        setStatus(`播放 "${seg.motion}"${seg.expr ? ' + 口型 ' + seg.expr : ''} (${s + 1}/${segments.length})`);
        
        // 加载手势动作动画
        const clip = await loadMotionGltf(seg.motion);
        
        /**
         * AnimationMixer 播放动画的核心 API:
         */
        mixer.stopAllAction(); // 停止当前所有正在播放的动画
        
        // clipAction: 获取/创建指定动画片段的动作实例
        // 第二个参数指定动作作用的模型根节点
        const act = mixer.clipAction(clip, model);
        act.reset();              // 重置动作到初始状态
        act.setLoop(THREE.LoopOnce); // 设置循环模式：只播放一次（不是 LoopRepeat）
        act.clampWhenFinished = true; // 播放完毕后保持在最后一帧
        act.play();               // 开始播放
        
        // 口型动画（如果需要）
        if (seg.expr) {
          const mclip = await loadExpression(seg.expr);
          if (mclip) {
            const mact = mixer.clipAction(mclip, model);
            mact.reset().play();
          }
        }
        
        // 等待动画播放完毕（duration 单位是秒）
        await waitClip(clip.duration);
        
      } else if (seg.expr) {
        // 纯口型（无手势动作）
        setStatus(`口型 ${seg.expr} (${s + 1}/${segments.length})`);
        const mclip = await loadExpression(seg.expr);
        if (mclip) {
          mixer.stopAllAction();
          const mact = mixer.clipAction(mclip, model);
          mact.reset();
          mact.setLoop(THREE.LoopOnce);
          mact.clampWhenFinished = true;
          mact.play();
          await waitClip(mclip.duration);
        }
      }
      // 段间微停顿 120ms，让动作之间有自然过渡
      await sleep(120);
    } catch (e) {
      console.error('段播放失败:', e);
      setStatus('播放失败: ' + e.message, 'error');
      break;
    }
  }
  
  if (!stopFlag) {
    setStatus(`播放完成（${segments.length} 段）`);
  }
}

/**
 * 等待指定时长（用于动画播放同步）
 * @param {number} dur - 等待时长（秒）
 * @returns {Promise}
 */
function waitClip(dur) {
  return new Promise(resolve => setTimeout(resolve, dur * 1000));
}

/**
 * 通用睡眠函数
 * @param {number} ms - 毫秒数
 * @returns {Promise}
 */
const sleep = ms => new Promise(r => setTimeout(r, ms));

/**
 * ============================================
 * 播放入口：主交互函数
 * ============================================
 */
/**
 * 用户点击"播放"按钮或回车时触发的核心函数
 * 流程：发送文本 -> 后端翻译 -> 播放动画序列
 * @param {string} text - 用户输入的文本
 */
async function playText(text) {
  if (!text.trim()) return; // 空文本直接返回
  playing = true;
  playBtn.disabled = true; // 播放中禁用按钮防止重复点击
  
  try {
    setStatus('正在翻译…', 'loading');
    
    // fetch: 发送 HTTP GET 请求到后端翻译 API
    // encodeURIComponent: 将中文文本转为 URL 安全格式
    const resp = await fetch('/api/translate?text=' + encodeURIComponent(text));
    
    // resp.json(): 解析 JSON 响应
    // 返回格式: { result: 1, content: [{ motion: "...", expression: "..." }], ... }
    const data = await resp.json();
    
    // 检查后端返回状态
    if (data.result !== 1 || !data.content || !data.content.length) {
      setStatus('翻译失败: ' + (data.description || JSON.stringify(data)), 'error');
      return;
    }
    
    console.log('翻译结果:', data.content);
    await playSequence(data.content); // 开始播放动画序列
    
  } catch (e) {
    console.error(e);
    setStatus('出错: ' + e.message, 'error');
  } finally {
    // finally: 无论成功失败都要执行，释放状态
    playing = false;
    playBtn.disabled = false;
  }
}

// ============ 事件监听 ============
// addEventListener: 为 DOM 元素添加事件监听
playBtn.addEventListener('click', () => playText(input.value)); // 点击播放按钮
input.addEventListener('keydown', e => { 
  if (e.key === 'Enter') playBtn.click(); // 输入框按回车也触发播放
});

/**
 * ============================================
 * Three.js 渲染循环（动画帧）
 * ============================================
 */
/**
 * Clock: Three.js 提供的时间工具类
 * getDelta(): 获取上一帧到当前帧的时间间隔（秒）
 * 用于实现帧率无关的动画（无论 30fps 还是 120fps 动画速度一致）
 */
const clock = new THREE.Clock();

/**
 * animate: 渲染循环函数，每帧调用一次
 * 使用 requestAnimationFrame 实现浏览器原生帧调度
 */
function animate() {
  requestAnimationFrame(animate); // 调度下一帧（递归调用形成循环）
  
  const dt = clock.getDelta(); // 获取帧间隔时间
  
  /**
   * mixer.update(dt): 更新动画混合器
   * 必须每帧调用，参数是当前帧与上一帧的时间差
   * 内部会自动根据时间推进所有活动的动画
   */
  if (mixer) mixer.update(dt);
  
  /**
   * renderer.render(scene, camera): 执行渲染
   * 参数1: 要渲染的场景
   * 参数2: 渲染使用的相机
   * Three.js 会根据相机视角，将 3D 场景投影到 2D Canvas 上
   */
  renderer.render(scene, camera);
}

// 暴露到全局供调试
window.__renderer = renderer;
window.__camera = camera;
window.__scene = scene;

// 启动渲染循环
animate();

/**
 * ============================================
 * 响应式处理：窗口大小变化
 * ============================================
 */
window.addEventListener('resize', () => {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  
  renderer.setSize(w, h); // 重新设置渲染分辨率
  
  // 相机宽高比必须同步更新，否则会出现拉伸变形
  camera.aspect = w / h;
  
  /**
   * updateProjectionMatrix: 更新相机的投影矩阵
   * 修改 aspect 等属性后必须调用此方法才能生效
   */
  camera.updateProjectionMatrix();
});

/**
 * ============================================
 * 启动初始化
 * ============================================
 */
(async () => {
  try {
    await loadModel(); // 等待模型加载完成
    
    // 更新 UI 状态
    modeBadge.textContent = '在线';
    modeBadge.style.background = 'rgba(52,211,153,0.15)';
    modeBadge.style.color = '#6ee7b7';
    setStatus('就绪 · 输入文字开始翻译手语');
    
  } catch (e) {
    console.error(e);
    setStatus('模型加载失败: ' + e.message, 'error');
  }
})();
</script>
