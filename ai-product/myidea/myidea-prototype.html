<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyIdea · 界面原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: #06070D;
  color: #E8EAF2;
  overflow-x: hidden;
}
body::before, body::after {
  content: '';
  position: fixed;
  border-radius: 50%;
  filter: blur(120px);
  pointer-events: none;
  z-index: 0;
}
body::before {
  width: 520px; height: 520px;
  background: rgba(139,92,246,.14);
  top: -140px; left: calc(50% - 480px);
}
body::after {
  width: 460px; height: 460px;
  background: rgba(34,211,238,.09);
  top: 120px; right: calc(50% - 520px);
}
.page-head {
  text-align: center;
  padding: 30px 16px 6px;
  position: relative; z-index: 1;
}
.page-head h1 {
  font-size: 15px; font-weight: 500; letter-spacing: .04em; color: #8B91A5;
}
.page-head h1 b {
  font-weight: 600;
  background: linear-gradient(120deg, #A78BFA, #22D3EE);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.hint {
  font-size: 12px; color: #5A6072; margin-top: 6px;
}
.controls {
  display: flex; gap: 8px; justify-content: center; margin-top: 14px; flex-wrap: wrap;
}
.controls button {
  font: 500 12px 'Inter', sans-serif;
  color: #C5C9D8;
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 999px;
  padding: 7px 14px;
  cursor: pointer;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  transition: .15s;
}
.controls button:hover {
  border-color: rgba(139,92,246,.55);
  color: #C4B5FD;
  box-shadow: 0 0 18px rgba(139,92,246,.18);
}
.stage {
  display: flex; justify-content: center;
  padding: 26px 16px 90px;
  position: relative; z-index: 1;
}
.phone {
  width: 375px; height: 812px;
  border-radius: 52px;
  border: 10px solid #050608;
  background: var(--bg);
  overflow: hidden;
  position: relative;
  box-shadow:
    0 0 90px rgba(139,92,246,.16),
    0 0 50px rgba(34,211,238,.1),
    0 34px 80px rgba(0,0,0,.6);
  --bg: #0A0E1A;
  --text: #F0F2F8;
  --muted: #7C8494;
  --accent-a: #A78BFA;
  --accent-b: #22D3EE;
  --accent-deep: #8B5CF6;
  --card-bg: rgba(255,255,255,.05);
  --card-bg-hover: rgba(255,255,255,.07);
  --glass: rgba(14,18,34,.82);
  --line: rgba(255,255,255,.1);
  --del-hover: #F87171;
  --grad: linear-gradient(120deg, var(--accent-deep), var(--accent-b));
}
.phone.light {
  --bg: #ECEEF6;
  --text: #171A2B;
  --muted: #6E7482;
  --accent-a: #7C3AED;
  --accent-b: #0891B2;
  --accent-deep: #8B5CF6;
  --card-bg: rgba(255,255,255,.62);
  --card-bg-hover: rgba(255,255,255,.82);
  --glass: rgba(255,255,255,.85);
  --line: rgba(23,26,43,.12);
  --del-hover: #DC2626;
  --grad: linear-gradient(120deg, #7C3AED, #0891B2);
}
.app {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  color: var(--text);
}
.glow {
  position: absolute;
  border-radius: 50%;
  filter: blur(70px);
  pointer-events: none;
  z-index: 0;
}
.glow-a {
  width: 300px; height: 300px;
  background: rgba(139,92,246,.24);
  top: -80px; left: -90px;
  animation: drift-a 26s ease-in-out infinite alternate;
}
.glow-b {
  width: 260px; height: 260px;
  background: rgba(34,211,238,.16);
  bottom: -60px; right: -80px;
  animation: drift-b 32s ease-in-out infinite alternate;
}
.phone.light .glow-a { background: rgba(139,92,246,.2); }
.phone.light .glow-b { background: rgba(34,211,238,.16); }
@keyframes drift-a {
  from { transform: translate(0, 0) scale(1); }
  to { transform: translate(90px, 120px) scale(1.25); }
}
@keyframes drift-b {
  from { transform: translate(0, 0) scale(1.1); }
  to { transform: translate(-100px, -110px) scale(.9); }
}
@media (prefers-reduced-motion: reduce) {
  .glow-a, .glow-b { animation: none; }
}
.statusbar {
  height: 48px; flex: none;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 28px 0;
  font: 500 13px 'Inter', sans-serif;
  position: relative; z-index: 2;
}
.notch {
  position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
  width: 128px; height: 26px;
  background: #050608;
  border-radius: 14px;
  z-index: 3;
}
.topbar {
  flex: none;
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 20px 16px;
  position: relative; z-index: 2;
}
.topbar h2 {
  font: 600 21px 'Inter', sans-serif;
  letter-spacing: .01em;
  background: linear-gradient(120deg, #F0F2F8 30%, #A78BFA 70%, #22D3EE);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.phone.light .topbar h2 {
  background: linear-gradient(120deg, #171A2B 30%, #7C3AED 70%, #0891B2);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.sort-btn {
  display: flex; align-items: center; gap: 5px;
  font: 500 12px 'Inter', 'PingFang SC', sans-serif;
  color: var(--muted);
  background: var(--card-bg);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 6px 12px;
  cursor: pointer;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  transition: .15s;
}
.sort-btn:hover {
  color: var(--accent-a);
  border-color: rgba(139,92,246,.5);
  box-shadow: 0 0 16px rgba(139,92,246,.2);
}
.sort-btn .chev { font-size: 10px; }
.menu {
  position: absolute; top: 96px; right: 16px; z-index: 45;
  background: var(--glass);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: 0 16px 48px rgba(0,0,0,.45);
  padding: 6px;
  min-width: 138px;
  opacity: 0; transform: translateY(-6px) scale(.97);
  pointer-events: none;
  transition: .16s ease;
}
.menu.open { opacity: 1; transform: none; pointer-events: auto; }
.menu button {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  width: 100%;
  font: 400 13px 'Inter', 'PingFang SC', sans-serif;
  color: var(--text);
  background: transparent;
  border: 0; border-radius: 9px;
  padding: 10px 12px;
  cursor: pointer;
  transition: .12s;
}
.menu button:hover { background: rgba(139,92,246,.12); }
.menu button .check { color: var(--accent-b); font-size: 12px; opacity: 0; }
.menu button.active .check { opacity: 1; }
.menu button.active { color: var(--accent-a); font-weight: 500; }
.list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 16px 110px;
  scrollbar-width: none;
  position: relative; z-index: 1;
}
.list::-webkit-scrollbar { display: none; }
.card {
  position: relative;
  background: var(--card-bg);
  color: var(--text);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 10px;
  display: grid;
  grid-template-columns: 20px 1fr;
  column-gap: 12px;
  user-select: none;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  transition: transform .18s ease, opacity .18s ease, background .18s ease;
  z-index: 1;
  --deg: 130deg;
}
.card::before {
  content: '';
  position: absolute; inset: 0;
  border-radius: 14px;
  padding: 1px;
  background: linear-gradient(var(--deg), rgba(139,92,246,.45), rgba(34,211,238,.38));
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  mask-composite: exclude;
  pointer-events: none;
  transition: .2s;
}
.phone.light .card::before {
  background: linear-gradient(var(--deg), rgba(124,58,237,.35), rgba(8,145,178,.3));
}
.card:hover { background: var(--card-bg-hover); }
.card:hover::before {
  background: linear-gradient(var(--deg), rgba(139,92,246,.75), rgba(34,211,238,.6));
}
.card.enter { animation: cardIn .34s cubic-bezier(.25,.8,.3,1) both; }
@keyframes cardIn {
  from { opacity: 0; transform: translateY(-14px); }
  to { opacity: 1; transform: none; }
}
.card.leaving {
  opacity: 0;
  transform: translateX(-40px);
  pointer-events: none;
}
.card .handle {
  align-self: start;
  margin-top: 3px;
  width: 20px; height: 24px;
  display: flex; align-items: center; justify-content: center;
  background: transparent; border: 0; cursor: grab;
  color: var(--muted);
  opacity: .55;
  touch-action: none;
  transition: .15s;
}
.card .handle:hover { opacity: 1; color: var(--accent-a); }
.card.dragging {
  z-index: 10;
  background: var(--card-bg-hover);
  box-shadow: 0 18px 48px rgba(0,0,0,.5), 0 0 30px rgba(139,92,246,.25);
  cursor: grabbing;
}
.card.dragging::before {
  background: linear-gradient(var(--deg), #A78BFA, #22D3EE);
}
.card.dragging .handle { color: var(--accent-a); opacity: 1; }
.card.shifting { transition: transform .18s ease; }
.card .content {
  font: 400 15px/1.65 'Noto Serif SC', Georgia, serif;
  word-break: break-word;
}
.card .meta {
  grid-column: 2;
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 10px;
}
.card time {
  display: flex; align-items: center; gap: 7px;
  font: 400 12px 'Inter', sans-serif;
  color: var(--muted);
}
.card time .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--grad);
  box-shadow: 0 0 8px rgba(139,92,246,.5);
  flex: none;
}
.card .del {
  font: 400 13px 'Inter', sans-serif;
  color: var(--muted);
  background: transparent; border: 0;
  padding: 2px 6px; margin: -2px -6px -2px 0;
  border-radius: 7px;
  cursor: pointer;
  opacity: .7;
  transition: .15s;
}
.card .del:hover { color: var(--del-hover); opacity: 1; }
.empty {
  position: absolute; left: 0; right: 0; top: 40%;
  text-align: center;
  color: var(--muted);
  display: none;
  z-index: 1;
}
.empty.show { display: block; }
.empty .spark {
  font-size: 30px;
  background: var(--grad);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 14px rgba(139,92,246,.45));
  margin-bottom: 14px;
}
.empty .big {
  font: 400 18px 'Noto Serif SC', serif;
  margin-bottom: 10px;
}
.empty .sub { font: 400 12px 'Inter', 'PingFang SC', sans-serif; }
.fab {
  position: absolute; right: 20px; bottom: 34px; z-index: 30;
  width: 56px; height: 56px;
  border-radius: 50%;
  border: 0;
  background: var(--grad);
  color: #FFFFFF;
  font: 500 28px 'Inter', sans-serif;
  line-height: 1;
  cursor: pointer;
  box-shadow: 0 8px 26px rgba(139,92,246,.45), 0 4px 14px rgba(34,211,238,.25);
  transition: transform .15s ease, box-shadow .15s ease;
}
.fab:hover {
  transform: scale(1.07);
  box-shadow: 0 10px 32px rgba(139,92,246,.6), 0 6px 18px rgba(34,211,238,.35);
}
.fab:active { transform: scale(.95); }
.homebar {
  position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
  width: 120px; height: 4px; border-radius: 2px;
  background: #FFFFFF;
  opacity: .25;
  z-index: 60;
  pointer-events: none;
}
.overlay {
  position: absolute; inset: 0; z-index: 40;
  background: rgba(4,6,14,.55);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  opacity: 0; pointer-events: none;
  transition: .2s;
}
.overlay.show { opacity: 1; pointer-events: auto; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 50;
  background: var(--glass);
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  color: var(--text);
  border-radius: 20px 20px 0 0;
  padding: 18px 18px 34px;
  transform: translateY(110%);
  transition: transform .26s cubic-bezier(.32,.72,.34,1);
  box-shadow: 0 -12px 48px rgba(0,0,0,.4);
}
.sheet::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0;
  height: 1.5px;
  background: linear-gradient(90deg, transparent, rgba(167,139,250,.7), rgba(34,211,238,.6), transparent);
}
.sheet.open { transform: none; }
.sheet-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
.sheet-head span { font: 600 15px 'Inter', 'PingFang SC', sans-serif; }
.sheet-head button {
  font: 400 12px 'Inter', 'PingFang SC', sans-serif;
  color: var(--muted);
  background: transparent; border: 0; cursor: pointer;
}
.sheet textarea {
  width: 100%;
  height: 110px;
  resize: none;
  background: var(--card-bg);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px;
  font: 400 15px/1.6 'Noto Serif SC', Georgia, serif;
  color: var(--text);
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.sheet textarea:focus {
  border-color: rgba(139,92,246,.6);
  box-shadow: 0 0 0 3px rgba(139,92,246,.12);
}
.sheet textarea::placeholder { color: var(--muted); }
.sheet .save {
  width: 100%;
  margin-top: 12px;
  padding: 14px;
  border: 0; border-radius: 12px;
  background: var(--grad);
  color: #FFFFFF;
  font: 600 15px 'Inter', 'PingFang SC', sans-serif;
  cursor: pointer;
  box-shadow: 0 6px 22px rgba(139,92,246,.4);
  transition: .15s;
}
.sheet .save:hover { filter: brightness(1.1); box-shadow: 0 8px 26px rgba(139,92,246,.55); }
.sheet .save:active { transform: scale(.985); }
@media (max-height: 980px) { .phone { zoom: .85; } }
@media (max-height: 840px) { .phone { zoom: .72; } }
</style>
</head>
<body>
<header class="page-head">
  <h1>MyIdea · <b>界面原型</b></h1>
  <div class="controls">
    <button id="themeBtn">切换浅色</button>
    <button id="emptyBtn">查看空状态</button>
    <button id="resetBtn">重置数据</button>
  </div>
  <p class="hint">点 + 记一条想法 · 拖卡片左侧手柄排序 · 点 ✕ 删除 · 右上角切换排序</p>
</header>
<div class="stage">
  <div class="phone" id="phone">
    <div class="app">
      <div class="glow glow-a"></div>
      <div class="glow glow-b"></div>
      <div class="statusbar">
        <span id="clock">14:32</span>
        <span>100%</span>
        <div class="notch"></div>
      </div>
      <div class="topbar">
        <h2>想法</h2>
        <button class="sort-btn" id="sortBtn"><span id="sortLabel">最新在前</span><span class="chev">▾</span></button>
      </div>
      <div class="menu" id="menu">
        <button data-mode="newest">最新在前<span class="check">✓</span></button>
        <button data-mode="oldest">最早在前<span class="check">✓</span></button>
        <button data-mode="custom">自定义<span class="check">✓</span></button>
      </div>
      <div class="list" id="list"></div>
      <div class="empty" id="empty">
        <div class="spark">✦</div>
        <div class="big">还没有想法</div>
        <div class="sub">点右下角 + 记下第一条</div>
      </div>
      <button class="fab" id="fab">+</button>
      <div class="overlay" id="overlay"></div>
      <div class="sheet" id="sheet">
        <div class="sheet-head">
          <span>记一条想法</span>
          <button id="sheetClose">收起</button>
        </div>
        <textarea id="input" maxlength="500" placeholder="此刻在想什么…"></textarea>
        <button class="save" id="saveBtn">保存</button>
      </div>
      <div class="homebar"></div>
    </div>
  </div>
</div>
<script>
(function () {
  var phone = document.getElementById('phone');
  var list = document.getElementById('list');
  var empty = document.getElementById('empty');
  var menu = document.getElementById('menu');
  var sortBtn = document.getElementById('sortBtn');
  var sortLabel = document.getElementById('sortLabel');
  var overlay = document.getElementById('overlay');
  var sheet = document.getElementById('sheet');
  var input = document.getElementById('input');
  var themeBtn = document.getElementById('themeBtn');
  var emptyBtn = document.getElementById('emptyBtn');
  var resetBtn = document.getElementById('resetBtn');
  var labels = { newest: '最新在前', oldest: '最早在前', custom: '自定义' };

  function makeSamples() {
    return [
      { id: 4, content: '给 App 加个每周回顾：周日晚提醒翻看这周记下的想法', ts: new Date(2026, 8, 30, 8, 5) },
      { id: 3, content: '读《卡片笔记写作法》，把零散的念头攒成一张张卡片', ts: new Date(2026, 9, 10, 21, 40) },
      { id: 2, content: '周末去逛那个新开的市集，顺便拍点素材', ts: new Date(2026, 9, 11, 9, 15) },
      { id: 1, content: '地铁上想到：给家里的老照片做个扫描归档流程，周末动手试试', ts: new Date(2026, 9, 12, 14, 30) }
    ];
  }

  var ideas = makeSamples();
  var sortMode = 'newest';
  var emptyMode = false;

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function fmt(ts) {
    var d = new Date(ts);
    return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function degOf(id) { return 102 + (id % 58); }
  function sorted() {
    var arr = ideas.slice();
    if (sortMode === 'newest') arr.sort(function (a, b) { return new Date(b.ts) - new Date(a.ts); });
    if (sortMode === 'oldest') arr.sort(function (a, b) { return new Date(a.ts) - new Date(b.ts); });
    return arr;
  }

  function render() {
    var arr = emptyMode ? [] : sorted();
    var html = arr.map(function (idea) {
      return '<article class="card" data-id="' + idea.id + '" style="--deg:' + degOf(idea.id) + 'deg">' +
        '<button class="handle" aria-label="拖动排序">' +
        '<svg width="10" height="18" viewBox="0 0 10 18"><circle cx="2" cy="2" r="1.6" fill="currentColor"/><circle cx="8" cy="2" r="1.6" fill="currentColor"/><circle cx="2" cy="9" r="1.6" fill="currentColor"/><circle cx="8" cy="9" r="1.6" fill="currentColor"/><circle cx="2" cy="16" r="1.6" fill="currentColor"/><circle cx="8" cy="16" r="1.6" fill="currentColor"/></svg>' +
        '</button>' +
        '<p class="content">' + esc(idea.content) + '</p>' +
        '<footer class="meta"><time><i class="dot"></i>' + fmt(idea.ts) + '</time><button class="del" aria-label="删除">✕</button></footer>' +
        '</article>';
    }).join('');
    list.innerHTML = html;
    empty.classList.toggle('show', emptyMode || ideas.length === 0);
  }

  function updateSortUI() {
    sortLabel.textContent = labels[sortMode];
    var btns = menu.querySelectorAll('button');
    btns.forEach(function (b) { b.classList.toggle('active', b.dataset.mode === sortMode); });
  }

  sortBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    menu.classList.toggle('open');
  });
  menu.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    sortMode = btn.dataset.mode;
    updateSortUI();
    menu.classList.remove('open');
    render();
  });
  document.addEventListener('click', function (e) {
    if (!menu.contains(e.target) && !sortBtn.contains(e.target)) menu.classList.remove('open');
  });

  document.getElementById('fab').addEventListener('click', function () {
    overlay.classList.add('show');
    sheet.classList.add('open');
    setTimeout(function () { input.focus(); }, 240);
  });
  function closeSheet() {
    overlay.classList.remove('show');
    sheet.classList.remove('open');
  }
  overlay.addEventListener('click', closeSheet);
  document.getElementById('sheetClose').addEventListener('click', closeSheet);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeSheet(); menu.classList.remove('open'); }
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && sheet.classList.contains('open')) saveIdea();
  });
  document.getElementById('saveBtn').addEventListener('click', saveIdea);

  function saveIdea() {
    var content = input.value.trim();
    if (!content) { input.focus(); return; }
    var idea = { id: Date.now(), content: content, ts: new Date() };
    ideas.unshift(idea);
    emptyMode = false;
    emptyBtn.textContent = '查看空状态';
    input.value = '';
    closeSheet();
    render();
    var el = list.querySelector('[data-id="' + idea.id + '"]');
    if (el) el.classList.add('enter');
  }

  list.addEventListener('click', function (e) {
    var del = e.target.closest('.del');
    if (!del) return;
    var card = del.closest('.card');
    var id = Number(card.dataset.id);
    card.classList.add('leaving');
    setTimeout(function () {
      ideas = ideas.filter(function (i) { return i.id !== id; });
      render();
    }, 260);
  });

  var drag = null;
  list.addEventListener('pointerdown', function (e) {
    var handle = e.target.closest('.handle');
    if (!handle) return;
    var card = handle.closest('.card');
    var cards = Array.prototype.slice.call(list.querySelectorAll('.card'));
    var startIndex = cards.indexOf(card);
    if (startIndex < 0) return;
    e.preventDefault();
    try { handle.setPointerCapture(e.pointerId); } catch (err) {}
    drag = {
      card: card, cards: cards, startIndex: startIndex,
      startY: e.clientY, step: card.offsetHeight + 10,
      offsetIndex: 0, maxIndex: cards.length - 1
    };
    card.classList.add('dragging');
    cards.forEach(function (c) { if (c !== card) c.classList.add('shifting'); });
  });
  document.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var dy = e.clientY - drag.startY;
    var offset = Math.round(dy / drag.step);
    if (offset < -drag.startIndex) offset = -drag.startIndex;
    if (offset > drag.maxIndex - drag.startIndex) offset = drag.maxIndex - drag.startIndex;
    drag.offsetIndex = offset;
    drag.card.style.transform = 'translateY(' + dy + 'px)';
    drag.cards.forEach(function (c, i) {
      if (i === drag.startIndex) return;
      var shift = 0;
      if (offset > 0 && i > drag.startIndex && i <= drag.startIndex + offset) shift = -drag.step;
      if (offset < 0 && i >= drag.startIndex + offset && i < drag.startIndex) shift = drag.step;
      c.style.transform = shift ? 'translateY(' + shift + 'px)' : '';
    });
  });
  document.addEventListener('pointerup', function () {
    if (!drag) return;
    var d = drag; drag = null;
    d.card.classList.remove('dragging');
    d.cards.forEach(function (c) {
      c.classList.remove('shifting');
      c.style.transform = '';
    });
    if (d.offsetIndex !== 0) {
      var ids = d.cards.map(function (c) { return Number(c.dataset.id); });
      var moved = ids.splice(d.startIndex, 1)[0];
      ids.splice(d.startIndex + d.offsetIndex, 0, moved);
      ideas = ids.map(function (id) {
        for (var j = 0; j < ideas.length; j++) if (ideas[j].id === id) return ideas[j];
      });
      sortMode = 'custom';
      updateSortUI();
      render();
    }
  });

  themeBtn.addEventListener('click', function () {
    phone.classList.toggle('light');
    themeBtn.textContent = phone.classList.contains('light') ? '切换深色' : '切换浅色';
  });
  emptyBtn.addEventListener('click', function () {
    emptyMode = !emptyMode;
    emptyBtn.textContent = emptyMode ? '退出空状态' : '查看空状态';
    render();
  });
  resetBtn.addEventListener('click', function () {
    ideas = makeSamples();
    sortMode = 'newest';
    updateSortUI();
    emptyMode = false;
    emptyBtn.textContent = '查看空状态';
    render();
  });

  var now = new Date();
  document.getElementById('clock').textContent = pad(now.getHours()) + ':' + pad(now.getMinutes());
  updateSortUI();
  render();
})();
</script>
</body>
</html>
